---
- name: "Create kickstart dependencies"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
  - "{{ _proxmox_config.install.files_dir }}"
  - "{{ _proxmox_config.install.iso_dir }}"
  delegate_to: localhost

- name: "Create kickstart file"
  ansible.builtin.template:
    src: "{{ _proxmox_config.install.kickstart_template or 'kickstart.cfg.j2' }}"
    dest: "{{ _proxmox_config.install.files_dir }}/ks-{{ _proxmox_config.vm.name }}.cfg"
    mode: "0600"
    force: true
  delegate_to: localhost
  no_log: true

- name: "Set Rocky ISO names"
  ansible.builtin.set_fact:
    _proxmox_media_backend_source_iso_name: "{{ _proxmox_config.install.source_iso_name }}"
    _proxmox_media_backend_generated_iso_name: >-
      {{
        _proxmox_config.install.generated_iso_name
        if _proxmox_config.install.generated_iso_name | length > 0
        else 'ks-' ~ _proxmox_config.vm.name
      }}

- name: Fingerprint installer inputs
  ansible.builtin.include_tasks: fingerprint.yml

- name: Build changed installer media
  when: _proxmox_media_rebuild | bool and not ansible_check_mode
  block:
  - name: "Create ISO file"
    ansible.builtin.command:
      argv:
      - xorriso
      - -as
      - mkisofs
      - -o
      - "{{ _proxmox_config.install.iso_dir }}/{{ _proxmox_media_backend_generated_iso_name }}.iso"
      - -V
      - "{{ _proxmox_media_backend_generated_iso_name | upper | regex_replace('[^A-Z0-9_]', '_') }}"
      - -J
      - -R
      - -graft-points
      - "ks.cfg={{ _proxmox_config.install.files_dir }}/ks-{{ _proxmox_config.vm.name }}.cfg"
    delegate_to: localhost
    changed_when: true


- name: Publish installer artifact
  ansible.builtin.include_tasks: publish.yml

- name: "Set Rocky VM media layout"
  ansible.builtin.set_fact:
    _proxmox_media_primary_cdrom_iso: "{{ _proxmox_media_backend_source_iso_name }}"
    _proxmox_media_secondary_cdrom_iso: "{{ _proxmox_media_remote_name }}"
