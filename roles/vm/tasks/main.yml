---
- name: Compose VM disks, interfaces and installer drives
  ansible.builtin.import_tasks: build.yml

- name: Verify both source and generated installer volumes before VM creation
  degitag.proxmox.vm_lifecycle:
    api: "{{ _proxmox_config.api }}"
    vmid: "{{ _proxmox_config.vm.vmid }}"
    name: "{{ _proxmox_config.vm.name }}"
    node: "{{ _proxmox_config.vm.node }}"
    operation: validate_media
    media: "{{ _proxmox_media_drives }}"
  delegate_to: localhost
  when: not ansible_check_mode

- name: Create absent VM without replacing existing disks
  community.proxmox.proxmox_kvm:
    api_host: "{{ _proxmox_config.api.host }}"
    api_user: "{{ _proxmox_config.api.user }}"
    api_password: "{{ _proxmox_config.api.password or omit }}"
    api_token_id: "{{ _proxmox_config.api.token_id or omit }}"
    api_token_secret: "{{ _proxmox_config.api.token_secret or omit }}"
    validate_certs: "{{ _proxmox_config.api.validate_certs }}"
    node: "{{ _proxmox_config.vm.node }}"
    vmid: "{{ _proxmox_config.vm.vmid }}"
    name: "{{ _proxmox_config.vm.name }}"
    description: lenmail.proxmox:installing
    state: present
    cores: "{{ _proxmox_config.vm.hardware.cores }}"
    memory: "{{ _proxmox_config.vm.hardware.memory }}"
    sockets: "{{ _proxmox_config.vm.hardware.sockets }}"
    numa: "{{ _proxmox_config.vm.hardware.numa }}"
    cpu: "{{ _proxmox_config.vm.hardware.cpu }}"
    machine: "{{ _proxmox_config.vm.hardware.machine }}"
    bios: "{{ _proxmox_config.vm.hardware.bios }}"
    efidisk0: >-
      {{ {'storage': _proxmox_config.vm.disk_storage, 'efitype': '4m', 'format': 'raw',
          'pre_enrolled_keys': _proxmox_config.vm.hardware.pre_enrolled_keys}
         if _proxmox_config.vm.hardware.efi else omit }}
    tpmstate0: "{{ {'storage': _proxmox_config.vm.disk_storage} if _proxmox_config.vm.hardware.tpm else omit }}"
    virtio: "{{ _proxmox_disks }}"
    net: "{{ _proxmox_networks }}"
    ide: "{{ _proxmox_media_drives }}"
    boot: "order={{ _proxmox_config.vm.boot_disk }};ide2"
    hostpci: "{{ _proxmox_config.vm.hardware.hostpci or omit }}"
    vga: "{{ _proxmox_config.vm.hardware.vga }}"
    kvm: "{{ _proxmox_config.vm.hardware.kvm }}"
    onboot: "{{ _proxmox_config.vm.hardware.onboot }}"
    ostype: "{{ _proxmox_config.vm.hardware.ostype }}"
    hotplug: "{{ _proxmox_config.vm.hardware.hotplug }}"
    scsihw: "{{ _proxmox_config.vm.hardware.scsihw }}"
    startup: "{{ _proxmox_config.vm.startup or omit }}"
    agent: enabled=1
    pool: "{{ _proxmox_config.vm.pool or omit }}"
  register: _proxmox_vm_created
  delegate_to: localhost
  throttle: "{{ _proxmox_config.legacy.create_vm_throttle }}"
  retries: "{{ _proxmox_config.legacy.create_vm_retries }}"
  delay: "{{ _proxmox_config.legacy.create_vm_retry_delay }}"
  when: not _proxmox_vm_state.exists
  no_log: true

- name: Apply configured cluster pacing after VM creation
  ansible.builtin.pause:
    seconds: "{{ _proxmox_config.legacy.create_vm_pause }}"
  when:
  - _proxmox_vm_created.changed | default(false)
  - not ansible_check_mode

- name: Prepare installation media and boot order
  degitag.proxmox.vm_lifecycle:
    api: "{{ _proxmox_config.api }}"
    vmid: "{{ _proxmox_config.vm.vmid }}"
    name: "{{ _proxmox_config.vm.name }}"
    node: "{{ _proxmox_config.vm.node }}"
    operation: prepare
    reinstall: "{{ _proxmox_config.deploy.reinstall }}"
    media: "{{ _proxmox_media_drives }}"
    boot_disk: "{{ _proxmox_config.vm.boot_disk }}"
  delegate_to: localhost
  when: not ansible_check_mode

- name: Start installer VM
  community.proxmox.proxmox_kvm:
    api_host: "{{ _proxmox_config.api.host }}"
    api_user: "{{ _proxmox_config.api.user }}"
    api_password: "{{ _proxmox_config.api.password or omit }}"
    api_token_id: "{{ _proxmox_config.api.token_id or omit }}"
    api_token_secret: "{{ _proxmox_config.api.token_secret or omit }}"
    validate_certs: "{{ _proxmox_config.api.validate_certs }}"
    node: "{{ _proxmox_vm_state.node | default(_proxmox_config.vm.node) }}"
    vmid: "{{ _proxmox_config.vm.vmid }}"
    state: started
  delegate_to: localhost
  throttle: "{{ _proxmox_config.legacy.start_vm_throttle }}"
  retries: "{{ _proxmox_config.legacy.start_vm_retries }}"
  delay: "{{ _proxmox_config.legacy.start_vm_retry_delay }}"
  when: not ansible_check_mode
  no_log: true

- name: Apply configured pacing after VM start
  ansible.builtin.pause:
    seconds: "{{ _proxmox_config.legacy.start_vm_pause }}"
  when: not ansible_check_mode

- name: Prefer the installed system on the next reboot to prevent installer loops
  degitag.proxmox.vm_lifecycle:
    api: "{{ _proxmox_config.api }}"
    vmid: "{{ _proxmox_config.vm.vmid }}"
    name: "{{ _proxmox_config.vm.name }}"
    node: "{{ _proxmox_config.vm.node }}"
    operation: disk_boot
    boot_disk: "{{ _proxmox_config.vm.boot_disk }}"
  delegate_to: localhost
  when: not ansible_check_mode

- name: Complete explicit reinstallation across a cold boot
  when:
  - _proxmox_config.deploy.reinstall | bool
  - _proxmox_config.deploy.wait_for_install | bool
  - not ansible_check_mode
  block:
  - name: Wait for installer to power off the reinstalled VM
    degitag.proxmox.vm_lifecycle:
      api: "{{ _proxmox_config.api }}"
      vmid: "{{ _proxmox_config.vm.vmid }}"
      name: "{{ _proxmox_config.vm.name }}"
      node: "{{ _proxmox_config.vm.node }}"
    delegate_to: localhost
    register: _proxmox_reinstall_state
    until: _proxmox_reinstall_state.status == 'stopped'
    retries: "{{ ((_proxmox_config.deploy.install_timeout | int) / 5) | round(0, 'ceil') | int }}"
    delay: 5

  - name: Start reinstalled system with disk boot order applied
    community.proxmox.proxmox_kvm:
      api_host: "{{ _proxmox_config.api.host }}"
      api_user: "{{ _proxmox_config.api.user }}"
      api_password: "{{ _proxmox_config.api.password or omit }}"
      api_token_id: "{{ _proxmox_config.api.token_id or omit }}"
      api_token_secret: "{{ _proxmox_config.api.token_secret or omit }}"
      validate_certs: "{{ _proxmox_config.api.validate_certs }}"
      node: "{{ _proxmox_reinstall_state.node }}"
      vmid: "{{ _proxmox_config.vm.vmid }}"
      state: started
    delegate_to: localhost
    no_log: true
