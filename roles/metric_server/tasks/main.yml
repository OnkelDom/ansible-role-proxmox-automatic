---
- name: Require a stable cluster identity
  ansible.builtin.assert:
    that:
      - proxmox_metric_server_state == 'absent' or proxmox_metric_server_cluster | length > 0
    fail_msg: Provide a globally unique cluster identity, including for standalone nodes.
- name: Reconcile the cluster-wide native metric server
  degitag.proxmox.metric_server:
    name: '{{ proxmox_metric_server_name }}'
    state: '{{ proxmox_metric_server_state }}'
    server: '{{ proxmox_metric_server_host }}'
    port: '{{ proxmox_metric_server_port }}'
    protocol: '{{ proxmox_metric_server_protocol }}'
    path: '{{ proxmox_metric_server_path }}'
    headers: '{{ proxmox_metric_server_headers }}'
    resource_attributes:
      monitoring.cluster: '{{ proxmox_metric_server_cluster }}'
    disabled: '{{ proxmox_metric_server_disabled }}'
    allow_insecure_http: '{{ proxmox_metric_server_allow_insecure_http }}'
  become: true
  no_log: true
