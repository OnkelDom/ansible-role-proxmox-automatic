---
extends: default
ignore: |
  .ansible/
  .venv/
  .git/
  .collections/
  .ci-roles/
  examples/roles/
  .cache/
  .e2e-live/
rules:
  line-length: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  indentation:
    spaces: 2
    indent-sequences: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
