---
name: Release
'on':
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
      with:
        python-version: '3.12'
    - name: Install build tools and check tag
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        python -m pip install -r requirements-test.txt
        python - <<'PY'
        import os
        import yaml
        version = str(yaml.safe_load(open('galaxy.yml'))['version'])
        assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match galaxy.yml'
        PY
    - name: Build and inspect release artifact
      id: artifact
      run: |
        python tools/build_collection.py
        artifact="$(python tools/collection_metadata.py artifact)"
        python tools/check_collection_artifact.py "$artifact"
        printf 'path=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
    - name: Create GitHub release with verified collection
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_ARTIFACT: ${{ steps.artifact.outputs.path }}
      run: |
        gh release create "$RELEASE_TAG" "$RELEASE_ARTIFACT" --verify-tag --generate-notes
