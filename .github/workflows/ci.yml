---
name: CI

'on':
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      - name: Install system packages
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y xorriso nftables

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Prepare CI role path
        run: |
          mkdir -p .ci-roles
          ln -sfn "$PWD" .ci-roles/proxmox_automatic

      - name: Run CI validation suite
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/.ci-roles
        run: make ci

      - name: Build and validate installable collection
        run: make package-smoke
