---
name: CI
'on':
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate / core ${{ matrix.core }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        core: ['2.20', '2.21']
    env:
      ANSIBLE_HOME: ${{ github.workspace }}/.ansible
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803   # v6
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
    - name: Install controller dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xorriso nftables
        python -m pip install -r requirements-test.txt
        python -m pip install 'ansible-core~=${{ matrix.core }}.0'
        ansible-galaxy collection install -r requirements.yml
    - name: Run shared checks and Proxmox integration fixtures
      run: bash tests/run_checks.sh
    - name: Upload verified collection
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4   # v5
      if: matrix.core == '2.21'
      with:
        name: collection
        path: degitag-proxmox-*.tar.gz
        retention-days: 14
